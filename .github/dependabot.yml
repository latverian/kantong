# Weekly version updates. Major npm versions are ignored here because they need a planned, tested
# upgrade (e.g. Vite 8 must move together with @vitejs/plugin-react 6 and the PWA plugin).
# Security fixes still arrive for every version through Dependabot *security* updates (repo setting).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
