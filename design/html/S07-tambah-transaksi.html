<!-- Interactive Keypad Simulation Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const amountEl = document.getElementById('amount-val');
      const keys = document.querySelectorAll('.grid button');

      keys.forEach((btn) => {
        btn.addEventListener('click', () => {
          const text = btn.innerText.trim();
          let current = amountEl.innerText;

          if (btn.querySelector('.material-symbols-outlined')) {
            // Backspace
            if (current.length > 1) {
              amountEl.innerText = current.slice(0, -1);
            } else {
              amountEl.innerText = '0';
            }
            return;
          }

          if (text === '000') {
            if (current !== '0') {
              amountEl.innerText = current + '000';
            }
            return;
          }

          if (current === '0') {
            amountEl.innerText = text;
          } else if (current.length < 8) {
            amountEl.innerText = current + text;
          }
        });
      });
    });
  </script>
</body></html>
